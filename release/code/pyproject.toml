[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "absorb"
version = "0.1.0"
description = "Self-reinforced geometric absorption: background, likelihoods and simulations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
